# The project's checks, run where no assistant's local setup can affect them.
#
# `npm run check` is the single entry point: the same command a contributor or
# an agent runs locally. The hooks in .claude/ run its two halves as a faster
# local gate, so everything is defined by the same npm scripts.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # One number, in .nvmrc, read by CI and by every version manager —
          # so "works on my machine" and "works in CI" mean the same thing.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
